name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore colorbrowser.keystore \
            -alias colorbrowser \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass colorbrowser -keypass colorbrowser \
            -dname "CN=ColorBrowser, OU=Dev, O=ColorBrowser, L=CN, ST=CN, C=CN"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: ColorBrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: ColorBrowser-release
          path: app/build/outputs/apk/release/app-release.apk
